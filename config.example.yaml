# pixie-agent configuration
# Copy to config.yaml (same directory as agent.py) and fill in your values.
#
device:
  name: my-pi                         # device name shown in Home Assistant
#
mqtt:
  broker: mqtt.example.lan            # hostname or IP of your MQTT broker
  port: 8883                          # 8883 for TLS, 1883 for plain
  tls:
    ca_cert: /opt/pixie-agent/ca.crt  # CA that signed the broker's certificate
  username: CHANGE_ME
  password: CHANGE_ME
  client_id: pixie-agent-my-pi        # fixed per host and unique; defaults to pixie-agent-<device name>
#
homeassistant:
  discovery_prefix: homeassistant
#
# How often each collector runs. Omitted intervals use the top-level
# "interval" (default 60). system, disk and services always run; the
# optional collectors (protonvpn, genmon_watchdog, borgmatic, ups_events) run only when their
# section is present here -- an empty section ({}) is enough.
collectors:
  system:
    interval_seconds: 15
  disk:
    interval_seconds: 300
  services:
    interval_seconds: 60
  # protonvpn: {}           # Proton VPN app/tunnel state; defaults to the system interval
  # genmon_watchdog: {}     # genmon process watchdog (restarts genmon.service); defaults to the services interval
  # borgmatic:              # Borg backup sensors, one set per borgmatic job
  #   interval_seconds: 60  # how often result and age are published
  #   refresh_seconds: 900  # how often the repository is read (also right after a job ends)
  #   jobs:                 # these are also the only jobs the backup command can start
  #     hourly:
  #       config: /etc/borgmatic.d/hourly.yaml
  #       unit: borgmatic-hourly.service
  #     daily:
  #       config: /etc/borgmatic.d/daily.yaml
  #       unit: borgmatic-daily.service
  # ups_events:             # UPS transfers to battery, counted from upsmon's journal
  #   ups:                  # upsmon's UPS name -> sensor key
  #     "ups@nas.local": ups_1
  #     "myups@localhost": ups_2
  script:
    interval_seconds: 30
  docker:
    interval_seconds: 15
  updates:
    interval_minutes: 1440
#
# Update-check agent (agent_updates.py)
updates:
  timezone: UTC                       # e.g. America/New_York
  log_dir: /var/log/pixie-agent       # where <hostname>.chk_updates.log is written
#
# Mount points to report on: display name -> path
mounts:
  Root: /
  Data: /mnt/data
#
# systemd units to report on
services:
  - pixie-agent
  - pixie-docker
  - docker
#
# Commands accepted over MQTT on upd_control/<device>/command.
# A command whose allow_* is false is refused; a missing key means allowed.
commands:
  allow_reboot: false
  allow_shutdown: false
  allow_check: true
  allow_update: false
  allow_backup: true      # {"action": "backup", "job": "hourly"} starts that borgmatic job's unit
